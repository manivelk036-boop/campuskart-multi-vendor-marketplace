spring.application.name=backend

# ===============================
# Database Configuration
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA Configuration
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format\_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Server Configuration
# ===============================

server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# Email Configuration
# ===============================

brevo.api-key=${BREVO_API_KEY}
brevo.from.email=${BREVO_FROM_EMAIL}
brevo.from.name=${BREVO_FROM_NAME:CampusKart}

# ===============================
# Product Image Upload Configuration
# ===============================

campuskart.upload.dir=${CAMPUSKART_UPLOAD_DIR:uploads/products}
campuskart.upload.max-file-size=${CAMPUSKART_UPLOAD_MAX_FILE_SIZE:5242880}
campuskart.upload.allowed-types=image/jpeg,image/png,image/webp,image/gif
campuskart.upload.public-base-url=/uploads/products